<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"
    <meta name="viewport" content="width=device-width, initial-scale=1"
    <meta name="robots" content="noindex, nofollow">
    <title> Week 3 Media and CSS</title>
    <meta name="description" content="This week we will be looking at media and an introduction to CSS">
    <!-- Add our CSS-->
    <link rel="stylesheet" href="./css/style.css">

</head>
<body>
<header>
    <img src="./img/lorem-logo.png" alt="header logo">
    <nav>
        <menu>
            <li><a href="index.html">Link One</a></li>
            <li><a href="index.html">Link Two</a></li>
            <li><a href="index.html">Link Three</a></li>
        </menu>
    </nav>
</header>
    <!-- the main text of this page -->
    <main>
        <!-- This first section of content is called a hero/masthead -->
        <section>
            <div>
                <h1>This is an Introduction Title</h1>
            </div>
        </section>
        <section>
            <!-- Column one-->
            <div>
                <figure>
                    <img src="./img/toronto.jpg" alt="Toronto skyline">
                    <figcaption>Lorem ipsum dolor sit amet consectetur adipisicing elit ab accusantium aliquid architecto aspernatur at atque.</figcaption>
                </figure>
            </div>
            <!-- Column two -->
            <div>
                <h2>I am title</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ab accusantium aliquid architecto aspernatur at atque.</p>
            </div>
        </section>
        <!-- our next row of content will hold our videos -->
        <section>
            <div>
                <h3>iframe Video</h3>
                <iframe <iframe width="1211" height="681" src="https://www.youtube.com/embed/X1aFkAkFASk" title="Avengers: Doomsday | Special Look | In Theaters December 18" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div>
                <h3>HTML Video Player Example</h3>
                <video controls loop autoplay poster="./img/toronto.jpg">
                    <source src="./video/toronto.mp4" type="video/mp4">
                    Your browser sucks upgrade the damn thing
                </video>

            </div>
        </section>
    </main>
    <footer>
        <h6>&copy; Week 3 Lesson</h6>
    </footer>
</body>
</html>
